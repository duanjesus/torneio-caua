name: torneio-caua

services:
  db:
    image: postgres:17-alpine
    container_name: torneio-db
    environment:
      POSTGRES_USER: torneio
      POSTGRES_PASSWORD: torneio
      POSTGRES_DB: torneio
    ports:
      - "5442:5432"
    volumes:
      - torneio-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torneio"]
      interval: 5s
      timeout: 3s
      retries: 10

  # O site inteiro em container (usado pelo Marreta): docker compose --profile app up -d --build
  web:
    profiles: ["app"]
    build: .
    container_name: torneio-web
    env_file: .env
    environment:
      DATABASE_URL: postgresql://torneio:torneio@db:5432/torneio
      DATABASE_URL_UNPOOLED: postgresql://torneio:torneio@db:5432/torneio
    ports:
      - "3030:3030"
    depends_on:
      db:
        condition: service_healthy

volumes:
  torneio-db:
